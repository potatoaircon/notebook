<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e9">
  <title>旅行地圖</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4' fill='%23d47768'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="site">
    <main class="map-screen" id="mapScreen">
      <div class="map-wrap">
        <svg class="map" viewBox="0 0 820 750" role="group" aria-label="東京出發，白馬、斑尾、越後中里互動旅遊地圖">
          <defs>
            <pattern id="redhatch" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-42)">
              <rect width="13" height="13" fill="#e9c8be"></rect>
              <rect width="2" height="13" fill="#d47768"></rect>
            </pattern>
            <pattern id="greenhatch" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-42)">
              <rect width="13" height="13" fill="#dfe4d6"></rect>
              <rect width="2" height="13" fill="#94a28a"></rect>
            </pattern>
          </defs>
          <!-- Decorative regions are separate vector shapes. Only the three named pins are destinations. -->
          <path class="region decorative" fill="url(#redhatch)" d="M72 124 L160 99 L230 121 L246 189 L206 237 L104 220 L65 175 Z"></path>
          <path class="region decorative" fill="url(#greenhatch)" d="M505 65 L571 75 L615 126 L592 189 L537 201 L485 149 Z"></path>
          <path class="region decorative" fill="url(#greenhatch)" d="M630 86 L707 132 L757 205 L714 237 L649 209 L608 144 Z"></path>
          <path class="region decorative" fill="url(#redhatch)" d="M76 516 L155 467 L255 482 L286 537 L259 622 L171 644 L72 595 Z"></path>
          <path class="region decorative" fill="url(#greenhatch)" d="M323 469 L415 442 L476 471 L511 558 L462 617 L369 598 L314 533 Z"></path>
          <path class="region decorative" fill="url(#redhatch)" d="M504 607 L564 579 L620 613 L612 692 L548 712 L491 665 Z"></path>
          <path class="region decorative" fill="url(#greenhatch)" d="M706 435 L761 456 L785 539 L742 587 L678 570 L663 501 Z"></path>
          <!-- Schematic placement: Hakuba west, Madarao north, Echigo east, Tokyo south. -->
          <path class="region" data-region="hakuba" fill="url(#greenhatch)" d="M90 321 L166 279 L240 295 L278 335 L250 401 L214 451 L109 448 L60 395 Z"></path>
          <path class="region" data-region="madarao" fill="url(#redhatch)" d="M281 115 L354 91 L453 111 L494 173 L467 246 L399 276 L324 252 L280 217 L240 179 Z"></path>
          <path class="region" data-region="echigo" fill="url(#greenhatch)" d="M510 230 L600 211 L700 269 L728 348 L678 409 L588 408 L524 357 L484 290 Z"></path>
          <path class="route" data-route="hakuba" d="M662 645 Q401 571 212 361"></path>
          <path class="route" data-route="madarao" d="M662 645 Q498 414 371 193"></path>
          <path class="route" data-route="echigo" d="M662 645 Q685 470 611 319"></path>
          <g class="pin" data-place="hakuba" role="button" tabindex="0" aria-pressed="false" aria-label="查看白馬交通資訊">
            <circle class="hit" cx="212" cy="361" r="55"></circle>
            <circle class="outer" cx="212" cy="361" r="15"></circle>
            <circle class="inner" cx="212" cy="361" r="5"></circle>
            <text class="place-label" x="212" y="403" text-anchor="middle">HAKUBA</text>
          </g>
          <g class="pin" data-place="madarao" role="button" tabindex="0" aria-pressed="false" aria-label="查看斑尾飯店及交通資訊">
            <circle class="hit" cx="371" cy="193" r="54"></circle>
            <circle class="outer" cx="371" cy="193" r="15"></circle>
            <circle class="inner" cx="371" cy="193" r="5"></circle>
            <text class="place-label" x="371" y="236" text-anchor="middle">MADARAO</text>
          </g>
          <g class="pin" data-place="echigo" role="button" tabindex="0" aria-pressed="false" aria-label="查看越後中里交通資訊">
            <circle class="hit" cx="611" cy="319" r="54"></circle>
            <circle class="outer" cx="611" cy="319" r="15"></circle>
            <circle class="inner" cx="611" cy="319" r="5"></circle>
            <text class="place-label" x="611" y="360" text-anchor="middle">
              <tspan x="611">ECHIGO</tspan>
              <tspan x="611" dy="19">NAKAZATO</tspan>
            </text>
          </g>
          <g class="origin" aria-hidden="true">
            <circle cx="662" cy="645" r="20" fill="#f5f1e9"></circle>
            <circle cx="662" cy="645" r="10" fill="#272c28"></circle>
            <circle cx="662" cy="645" r="2.5" fill="#faf7f0"></circle>
            <text class="map-title" x="662" y="690" text-anchor="middle">TOKYO</text>
            <text class="map-small" x="662" y="708" text-anchor="middle">START HERE</text>
          </g>
        </svg>
        <div class="compass" aria-hidden="true">
          <svg viewBox="0 0 30 46">
            <path d="M15 41V5M3 18L15 5l12 13" fill="none" stroke="currentColor" stroke-width="1.8"></path>
          </svg>
          N
        </div>
        <div class="hover-note" id="hoverNote" aria-hidden="true"></div>
      </div>
      <div class="mobile-choice" id="mobileChoice">
        <div>
          <strong id="choiceName"></strong>
          <small id="choiceTime"></small>
        </div>
        <button class="next" id="next" type="button" aria-label="進入目的地詳細資訊">→</button>
      </div>
    </main>
    <main class="detail-screen" id="detail">
      <button class="back" id="back" type="button">← 返回地圖</button>
      <section id="content"></section>
    </main>
  </div>
  <script defer src="./data/places.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
